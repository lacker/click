[book]
authors = ["Click contributors"]
language = "en"
src = "docs"
title = "Click reference"

[build]
build-dir = "target/click-docs"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/clicklang/click"
additional-css = ["docs/theme/click.css"]
additional-js = ["docs/theme/click.js"]

[output.html.search]
enable = true
