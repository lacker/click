# Per-test wall-clock policy for `cargo nextest run`. Every test's verdict
# comes from deterministic work: library tests and every fixture harness run
# without production's real-time tactic limits, and the command-line tests
# drive the tools under `click::cli::with_work_budget_verdicts`. Wall clock
# therefore decides no proof verdict.
#
# The gate is budgeted per test: a test belongs in it only if it takes under
# about two seconds while the gate runs tests in parallel. Anything slower is
# `#[ignore = "nightly: ..."]` and runs in the nightly profile below. A gate
# test still running after 10 seconds is reported as slow, and after 30 it is
# killed and fails, so a slow test is named on the change that adds it
# instead of growing the gate unnoticed. The kill sits 15 times above the
# rule: a 60-second kill once failed deep boundary tests at random on a
# loaded machine.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

# The mdtest and example-project harnesses are single test functions that each
# run a whole fixture suite. Their proof verdicts are deterministic; this
# larger outer timeout is process-level containment for an uncooperative hang.
# Measured 2026-08-20: mdtests 58.2s, examples 17.6s; 20 minutes leaves more
# than 20x headroom over the slower aggregate gate.
[[profile.default.overrides]]
filter = "binary(mdtests) | (binary(examples) & test(=example_projects))"
slow-timeout = { period = "60s", terminate-after = 20 }

# The nightly gate (`scripts/check.sh --nightly`) runs what the budgeted gate
# leaves out, including tests marked `#[ignore = "nightly: ..."]`. It has no
# time budget; this is hang containment only.
[profile.nightly]
slow-timeout = { period = "60s", terminate-after = 120 }

# Compute audits retain independent cold checks under their existing tool
# timeout. Avoid running their large body mutations against those same CPUs.
[test-groups.adler-compute]
max-threads = 1

[[profile.nightly.overrides]]
filter = 'binary(rust_import) & (test(/charon_adler2_(four_byte|general|small_batch)_compute/) | test(charon_adler2_general_public_checksum) | test(charon_adler2_incremental_client) | test(charon_adler2_resumed_client))'
test-group = "adler-compute"
