name: tests

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

# A newer push to the same branch supersedes this run; only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Queue checks validate the complete prospective upstream tree.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          # A missing base (for example, the first push) gets the full gate.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
             ! git cat-file -e "$base^{commit}"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | scripts/is-docs-only-change.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Restore installed tools before the shared setup script runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: Swatinem/rust-cache@v2
      # This runs the quality checks and unit tests, then builds fixture test
      # binaries once for the parallel runners below.
      - name: Prepare fixture test archive
        run: scripts/check.sh --ci-prepare target/nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

  fixture_shards:
    needs: [scope, prepare]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      - name: Run fixture partition ${{ matrix.shard }} of 4
        run: scripts/check.sh --ci-shard target/nextest-archive.tar.zst "slice:${{ matrix.shard }}/4"

  docs:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up documentation environment
        run: scripts/setup-environment.sh --docs-only
      - name: Run documentation-only gate
        run: scripts/check.sh --docs-only

  test:
    # Keep one stable required check named `test` while the fixture suite runs
    # in parallel and docs-only changes continue to use their focused gate.
    if: always()
    needs: [scope, prepare, fixture_shards, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected gate to pass
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHARDS_RESULT: ${{ needs.fixture_shards.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "check scope failed"
            exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$DOCS_RESULT" == success ]] || { echo "documentation gate did not pass"; exit 1; }
          else
            [[ "$PREPARE_RESULT" == success ]] || { echo "full-gate preparation did not pass"; exit 1; }
            [[ "$SHARDS_RESULT" == success ]] || { echo "one or more fixture partitions did not pass"; exit 1; }
          fi
