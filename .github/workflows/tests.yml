name: tests

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch supersedes this run; only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          # A missing base (for example, the first push) gets the full gate.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
             ! git cat-file -e "$base^{commit}"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | scripts/is-docs-only-change.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      # Installs the toolchain pinned in `rust-toolchain.toml`, the same one
      # local runs use.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The C++ semantic exporter is built against the exact Clang/LLVM API
      # pinned by scripts/build-cpp-exporter.sh. The gate never downloads it.
      - name: Install Clang 19.1.7 development libraries
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 libclang-19-dev llvm-19-dev libstdc++-14-dev
      # The documentation tooling is installed once into the shared tool
      # root (`scripts/tools.sh`) and cached by version; the gate itself
      # never installs anything or touches the network.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - run: scripts/install-tools.sh
      # The same script a developer runs locally, so the two cannot drift.
      - name: Run documentation-only gate
        if: steps.scope.outputs.docs_only == 'true'
        run: ./scripts/check.sh --docs-only
      - name: Run full gate
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/check.sh
